
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Club - High School Gaming Portal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0df2f2",
            "background-light": "#f5f8f8",
            "background-dark": "#1a0731",
            "arcade-yellow": "#ffcc00",
            "pixel-purple": "#4a1d96",
            "pixel-border": "#000000"
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0px",
            "lg": "0px",
            "xl": "0px",
            "full": "0px"
          },
        },
      },
    }
  </script>
  <style>
    /* Retro Pixel Aesthetic Overrides */
    body {
      image-rendering: pixelated;
      cursor: crosshair;
      margin: 0;
      background-color: #1a0731;
    }
    .pixel-border {
      box-shadow: 
        0px -4px 0px 0px black,
        0px 4px 0px 0px black,
        -4px 0px 0px 0px black,
        4px 0px 0px 0px black;
    }
    .pixel-button {
      box-shadow: 
        inset -4px -4px 0px 0px rgba(0,0,0,0.4),
        4px 4px 0px 0px black;
      transition: transform 0.1s steps(2);
    }
    .pixel-button:active {
      transform: translate(2px, 2px);
      box-shadow: 
        inset 4px 4px 0px 0px rgba(0,0,0,0.4),
        2px 2px 0px 0px black;
    }
    .pixel-card {
      border: 4px solid #000;
      background: #2d1354;
      position: relative;
    }
    .pixel-card::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 2px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
    .scanline-overlay {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .animate-pixel-float {
      animation: float 2s steps(8) infinite;
    }
    .animate-pixel-bounce {
      animation: float 1s steps(4) infinite;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-background-dark font-display text-white overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
